[game]
name = "Super Mario 64 DS"
id = "ASMP"
region = "Europe"
revision = 0
status = "initial-banks-recompiled; cartridge boot pending"
rom = "Super Mario 64 DS.nds"
rom_size = 0x01000000
sha1 = "1367529f2cb23e76ef295cb1727333ae8f0a6cd7"
sha256 = "ce5829aaa79f06c67140ed1f45cbca738b0a9d0180538c8c1498472d859db032"

[display]
# Host-only, user-selectable defaults. Adaptive output stays opt-in; SM64DS
# advertises top-screen support only, leaving the clickable bottom LCD native.
screen_layout = "stacked"
adaptive_widescreen = "none"

[system]
# Use the retail firmware's Automatic mode to launch the inserted Slot-1
# cartridge after the normal BIOS/firmware safety path. Set "manual" to return
# to the DS menu, or "preserve" to honor the dumped console setting.
startup_mode = "automatic"

[arm9]
rom_offset = 0x00004000
entry_pc = 0x02004800
load_address = 0x02004000
size = 0x0005d504

[arm7]
rom_offset = 0x001b4800
entry_pc = 0x02380000
load_address = 0x02380000
size = 0x00024b24

[framework]
path = "ndsrecomp"
pin = "87f7ad46482d7f63ab9f83ae31f2bb44fc7aed1a"

[decomp]
url = "https://github.com/tangosdev/sm64ds-decomp.git"
pin = "3b7450212bf0fae706a3be9bbd2d31d5c588b54f"
upstream_region = "Europe"
address_compatible = true
use = "exact ARM9 function names, modes, sizes, module layout, and future overlays"

# Upstream and the verified local dump both target ASMP revision 0 (Europe).
